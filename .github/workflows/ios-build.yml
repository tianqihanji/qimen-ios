name: iOS Build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # 用 macos-latest，跟随 GitHub 当前可用的最新 macOS 镜像（含最新 Xcode），
    # 避免写死 macos-15 之后镜像被下线导致任务直接找不到 runner。
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 编译（禁止签名，产出 iphoneos 二进制）
        run: |
          set -o pipefail
          xcodebuild \
            -project QimenLuopan.xcodeproj \
            -target QimenLuopan \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/out" \
            build 2>&1 | tee build.log

      - name: 打成未签名 IPA
        run: |
          mkdir -p Payload
          cp -R out/QimenLuopan.app Payload/
          zip -q -r QimenLuopan-unsigned.ipa Payload
          ls -lh QimenLuopan-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/QimenLuopan.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Payload/QimenLuopan.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" Payload/QimenLuopan.app/Info.plist

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: QimenLuopan-unsigned-ipa
          path: QimenLuopan-unsigned.ipa
          if-no-files-found: error

      - name: 上传构建日志（失败时看这里）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: 失败时把错误打到摘要
        if: failure()
        run: |
          echo "## 编译报错" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -n "error:" build.log | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
