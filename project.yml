name: QimenLuopan
options:
  bundleIdPrefix: com.tianqi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  QimenLuopan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QimenLuopanApp.swift
      - AppModel.swift
      - Astro.swift
      - QimenChart.swift
      - QimenConstants.swift
      - QimenEngine.swift
      - SolarTerm.swift
      - TrueSolarTime.swift
      - CompassService.swift
      - ContentView.swift
      - LuopanView.swift
      - NinePalaceView.swift
      - SettingsView.swift
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.tianqi.QimenLuopan
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

schemes:
  QimenLuopan:
    build:
      targets:
        QimenLuopan: all
    run:
      config: Debug
    archive:
      config: Release
